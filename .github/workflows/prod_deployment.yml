# This workflowvalidates, deploys and runs the specified bundle
# within production terget named "prod".

name: 'Production deployment'

concurrency: 1

# Trigger
on:
  push:
    branches: 
      - main
    paths:
      - 'bakehouse_analytics/**'

jobs:
  deploy:
    name: 'Deploy bundle'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: databricks/setup-cli@main

      - run: databricks bundle deploy
        working-directory: bakehouse_analytics
        env:
          DATABRICKS_TOKEN: ${{ secrets.SP_TOKEN }}
          DATABRICKS_ENV_BUNDLE: prod




    
